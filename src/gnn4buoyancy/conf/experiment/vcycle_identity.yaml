name: vcycle_identity
# The graph V-cycle against reference.py: the same cycle in scipy, on the hierarchy the
# graph object holds. Nothing is rebuilt between the two, so only the execution can differ.
profiles:
  quick: {device: cpu, sizes: [16, 32]}
  paper: {device: cuda, sizes: [32, 64, 128]}
cases: [conjugate_cavity, heat_sink, engine_bore]
omegas: [0.5, 0.7, 0.9]            # weighted-Jacobi relaxation
sweeps: [[2, 2], [1, 1], [3, 1]]   # (n_pre, n_post)
roundoff: 1.0e-14                  # claim bound, about 45 fp64 epsilons; measured at most 2.1e-16
# Tolerances come from the spread measured between reruns, 1 and 8 threads, CPU and CUDA,
# and deterministic and nondeterministic CUDA kernels. Each comment gives that spread.
regression:
  rel_diff: {rule: decades, tol: 1.0, floor: 1.0e-15}       # round-off 3.5e-18 to 2.1e-16, spread 0.83 decades; all under the floor, so this caps it at 1e-14
  rel_diff_max: {rule: decades, tol: 1.0, floor: 1.0e-15}   # as rel_diff
  rel_diff_min: {rule: decades, tol: 1.0, floor: 1.0e-15}   # as rel_diff
