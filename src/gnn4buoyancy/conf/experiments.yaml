# The experiment app: `gnn4buoyancy-experiment experiment=<name> profile=<quick|paper>`.
# It reuses the CLI's groups unchanged. The V-cycle is solver/graph_mg.yaml and the three
# operators are case/*.yaml, so an experiment runs the configuration a user runs.
defaults:
  - solver@vcycle: graph_mg
  - case@cases.conjugate_cavity: conjugate_cavity
  - case@cases.heat_sink: heat_sink
  - case@cases.engine_bore: engine_bore
  - experiment: vcycle_identity
  - _self_

profile: quick          # quick: CPU, in the default pytest run | paper: one GPU
device: ${experiment.profiles.${profile}.device}
seed: 0                 # NumPy is seeded with this before every hierarchy build
dtype: float64          # working precision; mixed_precision sets its own inner dtype
deterministic: true     # torch.use_deterministic_algorithms, so a GPU rerun is bitwise
mode: run               # run | check (against expected) | refresh (rewrite expected)
expected_dir: experiments/expected   # resolved against the directory the app starts in

hydra:
  run:
    dir: outputs/experiments/${experiment.name}.${profile}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: outputs/experiments/multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${experiment.name}.${profile}
