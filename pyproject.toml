[project]
name = "gnn4buoyancy-mwe"
version = "1.2.2"
description = "Minimal working example: a fixed-weight algebraic multigrid V-cycle executed as message-passing layers"
readme = "README.md"
# Tested on the versions in uv.lock. Widen only after testing: this package uses torch
# sparse layouts whose behaviour has changed across releases.
requires-python = ">=3.10,<3.13"
authors = [
    { name = "Teeratorn Kadeethum", email = "meen.kadeethum@siemens-energy.com" },
]
keywords = [
    "multigrid",
    "message passing",
    "graph neural network",
    "finite element method",
    "conjugate heat transfer",
    "GPU",
]
# An SPDX expression (PEP 639). No "License ::" classifier: build backends refuse both.
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "scipy>=1.10",
    "pyamg>=5.0",      # smoothed-aggregation hierarchy, used at setup only
    "hydra-core>=1.3", # configuration groups; every run parameter lives in one
]

# Each value must be a bare URL: TOML does not strip a "#" inside quotes, so a trailing note
# would be published as part of the URL.
[project.urls]
Repository = "https://github.com/teeratornk/multigrid-gnn"

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "matplotlib>=3.8"]
# Drawing the figures under supplementary/. Their numbers are checked without it.
plots = ["matplotlib>=3.8"]

[project.scripts]
gnn4buoyancy = "gnn4buoyancy.cli:main"
gnn4buoyancy-experiment = "gnn4buoyancy.experiments:main"
gnn4buoyancy-supplementary = "gnn4buoyancy.supplementary:main"

[build-system]
# The PEP 639 `license` and `license-files` fields need a recent hatchling.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gnn4buoyancy"]

# The Hydra groups ship inside the package, because an installed console script resolves
# config_path against the module rather than the working directory. No force-include is
# needed to achieve that, and adding one breaks the build: `packages` above already takes
# everything under src/gnn4buoyancy, including conf/ and its yaml, so force-include offers the
# same files a second time and hatchling aborts with "A second file is being added to the
# wheel archive at the same path". The failure is invisible to `pip install -e`; `uv build`
# catches it, and so does tests/test_packaging.py.

# Tests ship in the sdist because the suite is part of the release.
[tool.hatch.build.targets.sdist]
include = ["src", "tests", "experiments", "supplementary", "README.md", "LICENSE", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: deselect with -m 'not slow'",
    "gpu: needs a CUDA device; skips without one",
]
